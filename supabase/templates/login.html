<!--
  Rivl login email. Paste into Supabase → Authentication → Emails → Templates,
  for BOTH "Magic link" and "Confirm signup" (first-time logins use "Confirm signup").
  Subject: Your Rivl login code: {{ .Token }}
-->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #12141C; background: #F6F3EC;">
  <p style="font-size: 22px; font-weight: 800; margin: 0 0 24px;">Rivl<span style="color: #FF6A3D;">.</span></p>
  <p style="font-size: 16px; margin: 0 0 12px;">Your login code is:</p>
  <p style="font-size: 32px; font-weight: 800; letter-spacing: 6px; margin: 0 0 24px; padding: 16px 20px; background: #FFFFFF; border-radius: 12px; text-align: center;">{{ .Token }}</p>
  <p style="font-size: 16px; margin: 0 0 24px;">Type it on the Rivl login page, or tap the button to log straight in on this device.</p>
  <p style="margin: 0 0 32px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/dashboard" style="display: inline-block; padding: 14px 24px; background: #12141C; color: #F6F3EC; font-weight: 700; text-decoration: none; border-radius: 12px;">Log in to Rivl</a>
  </p>
  <p style="font-size: 14px; color: #5B5E68; margin: 0;">The code expires in one hour. If you didn’t ask to log in, you can ignore this email.</p>
</div>
